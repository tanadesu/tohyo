<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101B35">
  <link rel="icon" href="data:,">
  <title>MUCHABURI SPACE</title>
  <link rel="preload" as="image" href="assets/space-ship-interior.png">
  <link rel="preload" as="image" href="assets/space-lunar-arrival.png">
  <link rel="preload" as="image" href="assets/space-moon-detail.png">
  <link rel="preload" as="image" href="assets/space-deep-space.png">
  <link rel="preload" as="image" href="assets/space-muchaburi-space-logo.png">
  <link rel="stylesheet" href="roulette.css?v=1">
</head>
<body>
  <div id="roulette-auth-loading" class="roulette-auth-message">管理者権限を確認しています…</div>
  <main id="stage" data-phase="idle" aria-label="宇宙航行型お題抽選" hidden>
    <div class="space"><div class="space-dust"></div><div class="warp-depth"></div><div id="stars"></div></div>
    <canvas id="warp" aria-hidden="true"></canvas>
    <div id="planet" class="planet blue" aria-hidden="true"><div class="planet-body"></div><div class="planet-ring"></div></div>
    <div class="moon-scene" aria-hidden="true"></div>
    <div class="flight-glow" aria-hidden="true"></div>
    <div class="ship" aria-hidden="true">
      <canvas id="hatch"></canvas>
    </div>
    <div class="idle-copy"><img class="muchaburi-logo" src="assets/space-muchaburi-space-logo.png" alt="MUCHABURI SPACE"></div>
    <div class="result-dimmer" aria-hidden="true"></div>
    <div id="result" class="result" aria-live="polite" aria-atomic="true"><p class="result-label">今回のお題</p><h2 id="topic"></h2></div>
    <div class="flash" aria-hidden="true"></div>
    <div class="idle-footer">次のお題は、宇宙のどこかに。</div>
    <div id="controls" class="controls">
      <label class="topic-picker" for="topic-choice">
        <span>お題</span>
        <select id="topic-choice" aria-label="抽選するお題を選択">
          <option value="random">ランダム</option>
        </select>
      </label>
      <label class="topic-rule" for="topic-count">
        <span>対象数</span>
        <select id="topic-count" aria-label="ランダム抽選の対象にするお題数"></select>
      </label>
      <label class="topic-rule" for="avoid-count">
        <span>連続回避</span>
        <select id="avoid-count" aria-label="同じお題を避ける回数"></select>
      </label>
      <label class="topic-editor" for="topic-text">
        <span>内容 <small>改行できます</small></span>
        <textarea id="topic-text" rows="3" placeholder="先にお題を選択してください" aria-label="選択したお題の内容"></textarea>
      </label>
      <button id="save-topic" class="save-topic" type="button">保存</button>
      <button id="start" class="primary" type="button"><span>抽選開始</span><span class="key">SPACE</span><span class="arrow">↗</span></button>
      <button id="reset" type="button">リセット <span class="key">R</span></button>
      <span class="control-divider"></span>
      <button id="fullscreen" type="button" aria-label="全画面表示" title="全画面表示（F）"><svg viewBox="0 0 24 24"><path d="M8 4H4v4m12-4h4v4M4 16v4h4m12-4v4h-4"/></svg></button>
      <button id="hide" type="button" aria-label="操作パネルを隠す" title="操作パネルを隠す／表示（H）"><svg viewBox="0 0 24 24"><path d="m3 3 18 18M9.5 9.5a3.5 3.5 0 0 0 5 5M6 6C4 7.5 2.5 10 2 12c2 4 5.5 6 10 6 2 0 3.7-.4 5-1.2M9 6.3c1-.2 2-.3 3-.3 4.5 0 8 2 10 6-.6 1.2-1.3 2.3-2.2 3.2"/></svg></button>
    </div>
    <div id="hint" role="status"></div>
  </main>
  <script type="module">
    import { subscribeAuth, isAdmin, isFirebaseConfigured } from './firebase-service.js';
    const stage = document.querySelector('#stage');
    const gate = document.querySelector('#roulette-auth-loading');
    const showGate = message => { gate.textContent = message; gate.classList.add('visible'); };
    if (!isFirebaseConfigured()) {
      showGate('Firebase設定を確認してください');
    } else {
      subscribeAuth(async user => {
        if (!user || user.isAnonymous || !await isAdmin(user.uid)) {
          window.location.replace('/admin');
          return;
        }
        gate.remove();
        stage.hidden = false;
        await import('./roulette.js?v=1');
      }, false);
    }
  </script>
</body>
</html>
