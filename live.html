<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#030714">
  <title>ZERO-1 EXPO — Live Results</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Noto+Sans+JP:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="result.css"><link rel="stylesheet" href="live.css"><link rel="stylesheet" href="multiline-names.css">
</head>
<body class="live-screen">
  <div class="result-stars" aria-hidden="true"></div>
  <header><div class="result-brand"><span>Z</span> ZERO-1 EXPO</div><div class="result-label"><i></i> LIVE VOTE</div><button id="fullscreenButton">全画面表示</button></header>
  <main>
    <div class="live-meta"><p class="round" id="round">ROUND — / LIVE</p><div class="live-state" id="liveState">接続中</div></div>
    <h1 id="liveQuestion">リアルタイム集計を読み込んでいます</h1>
    <section class="screen-choices" id="liveChoices" aria-live="polite"></section>
    <div class="screen-total"><span>TOTAL VOTES</span><strong id="liveTotal">0</strong></div>
  </main>
  <div class="result-error" id="liveError" hidden>ライブ集計を読み込めませんでした。</div>
  <script type="module" src="live.js"></script>
</body>
</html>
