<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#030714">
  <title>ZERO-1 EXPO — Result</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Noto+Sans+JP:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="result.css"><link rel="stylesheet" href="multiline-names.css">
</head>
<body>
  <div class="result-stars" aria-hidden="true"></div>
  <header><div class="result-brand"><span>Z</span> ZERO-1 EXPO</div><div class="result-label">OFFICIAL RESULT</div><button id="fullscreenButton">全画面表示</button></header>
  <main id="resultScreen">
    <p class="round" id="round">ROUND —</p>
    <h1 id="resultQuestion">投票結果を読み込んでいます</h1>
    <section class="screen-choices" id="screenChoices" aria-live="polite"></section>
    <div class="screen-total"><span>TOTAL VOTES</span><strong id="screenTotal">—</strong></div>
    <p class="saved-time" id="savedTime"></p>
  </main>
  <div class="result-error" id="resultError" hidden>投票結果が見つかりませんでした。</div>
  <script type="module" src="result.js"></script>
</body>
</html>
